<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دون اتِّصال</title>
<style>
body{font-family:system-ui,-apple-system,'Cairo',sans-serif;background:#f4f4f5;color:#1f2937;
     min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;text-align:center}
.card{background:#fff;padding:32px 24px;border-radius:16px;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{margin:8px 0;font-size:22px} p{color:#6b7280;line-height:1.7}
.emoji{font-size:48px} .btn{display:inline-block;margin-top:16px;padding:10px 24px;
     background:#1f2937;color:#fff;border-radius:8px;text-decoration:none;font-weight:600}
</style></head><body>
<div class="card">
  <div class="emoji">📡</div>
  <h1>لا اتِّصال بِالإنتَرنِت</h1>
  <p>تَحَقَّق مِن اتِّصالك ثُمّ أَعِد المُحاوَلَة.</p>
  <a class="btn" href="javascript:location.reload()">إعادَة المُحاوَلَة</a>
</div></body></html>
