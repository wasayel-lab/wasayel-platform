# بَوّابَة CI — TESTING-PROTOCOL §5 الخُطوَة 1: لا دَمج إلّا بِاختِبارات خَضراء.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # ═══ قاعِدَةُ الوَظيفَةِ لِلبَراهينِ الحَيَّة (‏2026-10-25، تَدقيقُ الإطلاق lens-checkers-ci-2) ═══════════════════════
    # حاوِيَةٌ تولَدُ فارِغَةً وتَموتُ مَعَ الوَظيفَة — لا فَرعَ Neon ولا إنتاج، ولا سِرَّ (كَلِمَةُ مُرورِها لِحاوِيَةٍ لا يَبلُغُها أَحَد).
    # ‏`postgres:16` قَناةُ القاعِدَةِ المَحَلِّيَّةِ الَّتي قيسَت عَلَيها البَراهين (16.13). والخُطوَةُ الثانِيَةُ أَدناه وَحدَها تَقرَؤُها.
    # ‏2026-10-25 (مُراجَعَةُ تَيّارِ W8-5 الجَولَة ١): مُثَبَّتَةٌ عَلى 16.13 نَفسِه لا القَناة — رَفعٌ صَغيرٌ لِلقَناةِ كانَ يُغَيِّرُ ما يَقيسُه CI بِلا
    # كوميت (مَبدَأُ وَسمَيِ الـDockerfile). تُرفَعُ مَعَ قاعِدَةِ القِياسِ في كوميتٍ واحِد؛ والحارِسُ DockerImagePinTests.
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wasayel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      # ═══ الـSDK هُوَ SDK الصورَة، بِرَقمِه (‏2026-10-25، تَدقيقُ الإطلاق brief-P3-3 وlens-checkers-ci-11) ═══
      # كانَ `dotnet-version: 10.0.x` — قَناةٌ تَتَقَدَّمُ مَعَ كُلِّ رُقعَةٍ والـ`Dockerfile` بِرَقمٍ دَقيق، فَالأَخضَرُ هُنا لَم يَكُن قِياساً
      # لِلسِلسِلَةِ المَشحونَة. والرَقمُ في `setup-dotnet` وَحدَه لا يَكفي: صورَةُ ubuntu تَحمِلُ مُسبَقاً عِدَّةَ SDK و`dotnet` يَختارُ
      # أَحدَثَها بِلا `global.json`. فَيُكتَبُ `global.json` لِهذا التَشغيلِ مِن وَسمِ الـ`Dockerfile` (‏rollForward: disable)، ثُمَّ يُسأَلُ
      # `dotnet --version` عَنه. ورَفعُ الوَسمِ يَرفَعُ CI مَعَه بِلا سَطرٍ ثانٍ — `scripts/ci-sdk.sh` و`DockerImagePinTests`.
      - name: The image's SDK, as global.json for this run (Dockerfile)
        run: ./scripts/ci-sdk.sh write

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: The SDK in use is the image's SDK
        run: ./scripts/ci-sdk.sh verify

      - name: Build solution
        run: dotnet build PlatformV1.slnx -c Release

      - name: Run tests
        run: dotnet test tests/ACommerce.Platform.Tests/ACommerce.Platform.Tests.csproj -c Release --no-build

      # ═══ البَراهينُ الحَيَّةُ عَلى قاعِدَةِ الوَظيفَة — كانَت «ناجِحَةً» هُنا وهي تَرجِعُ مِن حارِسِها (‏2026-10-25، lens-checkers-ci-2) ═══
      # الخُطوَةُ أَعلاه بِلا قاعِدَة: كُلُّ `Live…ProofTests` يَرجِعُ مِن `if (!Enabled …) return;` أَخضَر. وهُنا البيئَةُ لِلخُطوَةِ وَحدَها.
      # و`CI_LIVE_PROOF_REQUIRED` يَجعَلُ `LiveProofJobTests` يَحمَرُّ إن دَخَلَها تَشغيلٌ بِلا عَلَمٍ أَو بِلا قاعِدَةٍ تُجيب.
      # ‏`LiveTenantExportProofTests` مُستَثنى: يَلزَمُه مَتجَرٌ مَملوكٌ، وقاعِدَةُ الوَظيفَةِ فارِغَة (يُشَغَّلُ عَلى فَرعٍ مَبذور — RELEASE-READINESS §٤).
      - name: Live proofs on the job's own Postgres
        env:
          WASAYEL_LIVE_PROOF: "1"
          CI_LIVE_PROOF_REQUIRED: "1"
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=wasayel_ci;Username=postgres;Password=postgres
        run: >-
          dotnet test tests/ACommerce.Platform.Tests/ACommerce.Platform.Tests.csproj -c Release --no-build
          --filter "(FullyQualifiedName~ACommerce.Platform.Tests.Live&FullyQualifiedName!~LiveTenantExportProofTests)|FullyQualifiedName~ReadinessEndpointTests.Live_database_answers_200_ready"
          --logger "console;verbosity=normal"

      # ═══ آلِيَّةُ حَقنِ البَصمَةِ تُشَغَّلُ مَرَّةً، وإلّا فَالإنتاجُ
      #     هُوَ أَوَّلُ مَن يَختَبِرُها (‏ADR-019) ═══════════════════════
      #
      # كُلُّ حُرّاسِ ‏ADR-019 الأُخرى تَفحَصُ **نَصَّ المَصدَر**: أَنّ
      # الـ`Dockerfile` يَحمِلُ `-p:SourceRevisionId=`، وأَنّ الوَظيفَةَ
      # تَكتُبُ المِلَفَّ في مَوضِعِه. **ولا واحِدَ مِنها يُشَغِّلُ
      # السِلسِلَة** «مِلَفّ ← خاصِّيَّة ← سِمَة ← جَواب» — و
      # `verify-production-boot.sh` يَنشُرُ **بِلا** الخاصِّيَّة.
      #
      # فَالمَوضِعُ الوَحيدُ الَّذي كانَت تُنَفَّذُ فيه هذِه السِلسِلَةُ
      # مِن طَرَفِها إلى طَرَفِها هُوَ **الإنتاج**. وأَوَّلُ تَرقِيَةِ SDK
      # تَكسِرُ الاصطِلاحَ كانَت تَمُرُّ صامِتَةً ولا يُمسِكُها إلّا
      # المُستَخدِم. هذِه الخُطوَةُ تَجعَلُ القِياسَ يُعيدُ إنتاجَ نَفسِه
      # في كُلِّ دَفعَة.
      - name: The build stamp actually reaches the binary
        run: |
          set -euo pipefail
          stamp=0000000000000000000000000000000000000abc
          dotnet publish apps/V1.App/V1.App.csproj -c Release \
            -o "${RUNNER_TEMP}/stamped" --nologo -p:SourceRevisionId="${stamp}"

          # ‏`grep -a` لا `strings`: الأَوَّلُ في coreutils/grep دائِماً،
          # والثاني مِن binutils وقَد لا يوجَد. **وقيسَ الشَكلُ هذا
          # بِعَينِه مَحَلِّيّاً** على `V1.App.dll` مَبنِيّاً بِنَفسِ
          # القيمَة، فَأَعطى السَطرَ المُنتَظَر.
          got="$(grep -aoE '1\.0\.0\+[0-9a-f]{40}' \
                 "${RUNNER_TEMP}/stamped/V1.App.dll" | head -1 || true)"

          if [ "${got}" != "1.0.0+${stamp}" ]; then
            echo "::error::البَصمَةُ لَم تَبلُغِ الثُنائِيّ — المُنتَظَر 1.0.0+${stamp} والمَقروء '${got:-<لا شَيء>}'."
            echo "‏ADR-019 يَقومُ على أَنّ -p:SourceRevisionId يُبَثُّ في AssemblyInformationalVersionAttribute."
            echo "إن كَسَرَت تَرقِيَةُ SDK هذا الاصطِلاح، فَنُقطَةُ /health تَكذِبُ صامِتَةً."
            exit 1
          fi
          echo "✅ البَصمَةُ بَلَغَتِ الثُنائِيّ: ${got}"

  # الطَبَقات الساكِنَة ١–٥ و٧ (‏docs/VERIFICATION-LAYERS.md): تَقرَأ
  # المَصدَر فَقَط — بِلا بِناء ولا خادِم ولا مُتَصَفِّح — فَتُشَغَّل
  # مُوازِيَةً لِلبِناء ولا تُبطِئ البَوّابَة. الطَبَقَة السادِسَة
  # (‏Playwright) تَحتاج تَطبيقاً حَيّاً وتَبقى خارِج البَوّابَة عَمداً؛
  # والسابِعَة ساكِنَة فَهي في البَوّابَة، واحتَفَظَت بِرَقمِها ولَم
  # تَأخُذ رَقم السادِسَة — فَالرَقم عُنوان يُحال إلَيه لا تَرتيب تَشغيل.
  #
  # كُلّ طَبَقَة تَطبَع عَدَد ما فَحَصَتهُ وتَفشَل إن كانَ صِفراً؛ والدَين
  # المَقيس اليَوم مُثَبَّت بِأَسمائِه في `scripts/*-baseline.txt` وفي
  # `scripts/verify-i18n-debt-ledger.txt` فَلا يُفشِل البَوّابَة —
  # يُفشِلُها خَرقٌ **جَديد** أَو إدخالٌ مُثَبَّت لَم يَعُد يَقَع
  # (فَالسِجِلّ لا يَنتَفِخ ولا يَعفَن).
  #
  # ‏(‏2026-10-25 — يُلحَقُ ولا يُعادُ حَرفٌ فَوقَه؛ تَدقيقُ الإطلاق lens-checkers-ci-10) و«١–٥ و٧» أَعلاه صارَت ناقِصَة: السكربتُ يُشَغِّلُ
  # ‏١–٥ و٧–١٠ (والثامِنَةُ تَحمِلُ ٨ب — كاتالوجُ المُزَوِّدينَ بَيانات — في `verify-architecture.sh`)، ويَختِمُ «All nine static layers green».
  # فَاسمُ الخُطوَةِ يَقولُ ما يُشَغَّل، و`StaticLayerLabelTests` يَشتَقُّه مِن مَصفوفَةِ `LAYERS` في `verify-static.sh` فَلا يَنجَرِفُ ثانِيَةً.
  static-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static verification layers 1-5, 7-10
        run: ./scripts/verify-static.sh

  # ═══ بَوّابَةُ الإقلاعِ الإنتاجيِّ عَلى فَرعِ Neon — حينَ يوجَدُ سِرُّه (‏2026-10-12، P3-2) ═══════════
  #
  # الوَظيفَتانِ أَعلاه تَبنِيانِ وتَختَبِرانِ وتَقرَآنِ المَصدَرَ ولا تُقلِعان، و`verify-production-boot.sh` يُقلِعُ الثُنائِيَّ
  # المَنشورَ بِوَضعِ Production عَلى قاعِدَةٍ حَقيقِيَّةٍ ويَطلُبُ مَساراتِه — الشَيءُ الوَحيدُ الَّذي أَمسَكَ حادِثَةَ `BindAsync`
  # (‏DEPLOY.md §٢·و). وكانَ لا يُشَغَّلُ إلّا بِاليَد. **والقاعِدَةُ فَرعُ Neon مَنسوخٌ لا الإنتاج**: البَوّابَةُ تُقلِعُ وتَبذُر.
  #
  # **وغِيابُ السِرِّ لا يُفشِلُ شَيئاً**: ‏`::notice::` وسَطرُ «لَم يُقَس» في المُلَخَّص — طَلَباتُ الدَمجِ مِن نُسَخٍ مُتَفَرِّعَةٍ
  # لا تَرى الأَسرار، ومُستَودَعٌ بِلا السِرِّ لا يُوقَفُ عَن البِناء. **ورَمزُ 3** (ما عِندَ المُشَغِّل — حِصَّةُ Neon مَثَلاً، و‑٥)
  # ‏`::warning::` لا فَشَل: لَيسَ حُكماً عَلى الكود (§٢·و)، ونَسَقُه «لَم يُقَس» في `deploy-hf.yml`. و1 أَو 2 تُفشِلُ الوَظيفَة.
  # ‏`secrets` لا يُقرَأُ في شَرطِ خُطوَة، فَيُسنَدُ إلى مُتَغَيِّرِ الوَظيفَةِ ويُسأَلُ عَن حُضورِه هُناك.
  #
  # **(‏2026-10-24) والفَرعُ حالَةٌ مُشتَرَكَةٌ قابِلَةٌ لِلتَغيير**: كُلُّ دَفعَةٍ وطَلَبِ دَمجٍ يُقلِعُ Production (‏CreateOrUpdate وPlatformSeed)
  # عَلى الفَرعِ الواحِدِ نَفسِه، فَتَشغيلانِ مُتَزامِنانِ يَتَسابَقانِ عَلى إنشاءِ نَوعِ وَثيقَةٍ جَديد (‏23505 — يُقرَأُ كَسراً في الكودِ، 1،
  # فَيَحمَرُّ CI ويُحجَبُ النَشر). فَمَجموعَةُ تَزامُنٍ واحِدَةٌ بِلا إلغاءٍ لِلجاري: تَشغيلٌ واحِدٌ عَلى الفَرعِ في كُلِّ لَحظَة (DEPLOY.md §٢·و).
  #
  # **(‏2026-10-24، الجَولَةُ ١ لِلمُراجَعَة) ولا يُلغى المُنتَظِرُ أَيضاً — `queue: max`**: بِالافتِراضِ (`single`) يَنتَظِرُ في المَجموعَةِ واحِدٌ،
  # وكُلُّ وافِدٍ أَحدَثَ يُلغيه ويَحُلُّ مَحَلَّه. والوَظيفَةُ تَعمَلُ لِلدَفعِ وطَلَبِ الدَمجِ مَعاً، فَدَفعَةُ `main` المُنتَظِرَةُ يُلغيها أَيُّ طَلَبِ دَمجٍ بَعدَها
  # ⇒ تَشغيلُ CI ‏«مُلغىً» ⇒ `deploy-hf.yml` لا يَنشُر (يَشتَرِطُ `conclusion == 'success'`) — حَجبٌ صامِتٌ بِلا عَيب، وهو ما وُضِعَت المَجموعَةُ لِمَنعِه.
  # و`max` يُبقي حَتّى ‏100 مُنتَظِرٍ بِتَرتيبِ وُصولِهِم (وَثائِقُ GitHub، `jobs.<job_id>.concurrency`) — فَالكُلفَةُ انتِظارٌ لا فَقد. (DEPLOY.md §٢·و)
  # ‏(‏2026-10-24 — تَيّارُ S16، يُلحَقُ ولا يُعادُ حَرفٌ فَوقَه) و«بِتَرتيبِ وُصولِهِم» أَدَقُّه بِنَصِّ GitHub: FIFO «according to the time each one started
  # waiting on the concurrency group»، و«ordering is not guaranteed». و«When the queue is full, any additional jobs or workflow runs are canceled» —
  # فَالمُلغى تَحتَ `max` (لِأَيِّ حَدَث) طابورٌ مُمتَلِئٌ أَسقَطَ الوافِدَ أَو إلغاءٌ بِاليَد، لا «سَبَقَه أَحدَث». (DEPLOY.md §٢·و)
  production-boot:
    runs-on: ubuntu-latest
    concurrency:
      group: production-boot
      cancel-in-progress: false
      queue: max
    env:
      BOOT_GATE_CONNECTION_STRING: ${{ secrets.BOOT_GATE_CONNECTION_STRING }}
    steps:
      - name: No Neon branch secret — the boot gate is not measured
        if: env.BOOT_GATE_CONNECTION_STRING == ''
        run: |
          echo "::notice::بَوّابَةُ الإقلاعِ لَم تُشَغَّل — السِرُّ BOOT_GATE_CONNECTION_STRING غائِب (فَرعُ Neon مَنسوخ، لا الإنتاج). DEPLOY.md §٢·و."
          echo "### بَوّابَةُ الإقلاعِ الإنتاجيّ: لَم يُقَس — السِرُّ \`BOOT_GATE_CONNECTION_STRING\` غائِب" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.BOOT_GATE_CONNECTION_STRING != ''

      # ‏(‏2026-10-25) والبَوّابَةُ تَنشُرُ الثُنائِيَّ وتُقلِعُه — فَبِـSDK الصورَةِ نَفسِه، كَوَظيفَةِ البِناءِ أَعلاه.
      - name: The image's SDK, as global.json for this run (Dockerfile)
        if: env.BOOT_GATE_CONNECTION_STRING != ''
        run: ./scripts/ci-sdk.sh write

      - uses: actions/setup-dotnet@v4
        if: env.BOOT_GATE_CONNECTION_STRING != ''
        with:
          global-json-file: global.json

      - name: The SDK in use is the image's SDK
        if: env.BOOT_GATE_CONNECTION_STRING != ''
        run: ./scripts/ci-sdk.sh verify

      - name: Production boot gate on the Neon branch
        if: env.BOOT_GATE_CONNECTION_STRING != ''
        run: |
          export ConnectionStrings__Postgres="${BOOT_GATE_CONNECTION_STRING}"
          # سِرُّ البَوّابَةِ لا سِرُّ الإنتاج — يُوَلَّدُ لِكُلِّ تَشغيلٍ ولا يُحفَظ.
          export ACOMMERCE_AUTH_SECRET="$(openssl rand -hex 32)"
          code=0
          ./scripts/verify-production-boot.sh || code=$?
          case "$code" in
            0) echo "### بَوّابَةُ الإقلاعِ الإنتاجيّ: عَبَرَت" >> "$GITHUB_STEP_SUMMARY" ;;
            3) echo "::warning::بَوّابَةُ الإقلاع: ما عِندَ المُشَغِّل (3) — لَيسَ حُكماً عَلى الكود؛ سَطرُ «التَشخيص» أَعلاه يُسَمّيه."
               echo "### بَوّابَةُ الإقلاعِ الإنتاجيّ: لَم يُقَس — ما عِندَ المُشَغِّل (3)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "### بَوّابَةُ الإقلاعِ الإنتاجيّ: ✗ رَمزُ ${code}" >> "$GITHUB_STEP_SUMMARY"
               exit "$code" ;;
          esac
