# ══════════════════════════════════════════════════════════════════════
#  مِرآة `main` إلى مُستودَع الـSpace على Hugging Face
# ══════════════════════════════════════════════════════════════════════
#
#  **العِلَّة**: الإنتاج الحَيّ يُنشَر مِن المُستودَع القَديم
#  (`acommerce-lab/acommerce-platform` فَرع `deploy-hf`). فَكُلّ إصلاح
#  يُودَع هُنا — بِما فيه إصلاحٌ أَمنيّ — **لا يَبلُغ المُستَخدِم**. هذِه
#  الوَظيفَة تَقطَع ذلك: ما يَدخُل `main` ويَمُرّ البَوّابَةَ يَصير هو
#  ما يَعمَل.
#
#  **ولِماذا بَعدَ CI لا مَعَه**: ‏`workflow_run` لا يُشَغَّل إلّا حينَ
#  تَنتَهي «CI»، والشَرطُ أَدناه يَشتَرِط `conclusion == 'success'`.
#  فَبِناءٌ أَحمَر لا يُنشَر أَبَداً. ولَو رُبِطَت الوَظيفَتان بِـ`on: push`
#  مُتَوازِيَتَين لَسَبَقَ النَشرُ نَتيجَةَ الاختِبارات وصارَت البَوّابَةُ
#  زينَةً.
#
#  **وما يُدفَع شَجَرَةٌ مُفلتَرَة لا الشَجَرَةُ كامِلَةً**: الـSpace
#  عامّ (‏والخاصّ يَحجُب التَطبيقَ نَفسَه خَلفَ تَسجيل دُخول)، فَكُلّ
#  مِلَفّ يَصِلُه مَقروءٌ لِأَيّ أَحَد. والوَظيفَة كانَت تَدفَع **757
#  مِلَفّاً مُتَتَبَّعاً** فيها `docs/` و`CLAUDE.md` و`scripts/` و
#  `tests/`. الآن تَدفَع ما يَحتاجُه `dotnet publish` وَحدَه — قائِمَةً
#  **مَقيسَةً مِن الـcsproj** يَبنيها `scripts/deploy-manifest.sh`
#  (‏إغلاق `ProjectReference` تَعَدِّيّاً). و`.dockerignore` يَبقى
#  دِفاعاً ثانِياً داخِلَ سِياق البِناء. التَفصيل في `docs/DEPLOY.md`.
#
#  **ولا رَمزَ في هذا المِلَفّ**: أَسماءُ أَسرارٍ ومُتَغَيِّرات فَقَط.
#  المَطلوب إنشاؤُه في إعدادات المُستودَع (‏Settings → Secrets and
#  variables → Actions):
#
#    | الاسم       | النَوع    | المِثال            | إلزاميّ |
#    |-------------|-----------|--------------------|---------|
#    | `HF_TOKEN`  | Secret    | ‏(رَمز بِصَلاحِيَّة write) | نَعَم |
#    | `HF_SPACE`  | Variable  | `wasayel/wasayel`  | نَعَم |
#    | `HF_USER`   | Variable  | `wasayel`          | لا — يُشتَقّ مِن `HF_SPACE` |
#    | `HF_SPACE_URL` | Variable | `acommerceecommerce-acommerce-ecommerce.hf.space` | لا — وبِدونِه **لا يُقاسُ الحَيّ** |
#    | `HF_HEALTH_WAIT_SECONDS` | Variable | `900` | لا — الافتِراض ‏900 |
#
#  و`HF_SPACE_URL` **لا يوقِفُ نَشراً بِغيابِه**: الخُطوَةُ تُحَذِّرُ
#  وتَكتُبُ في المُلَخَّصِ «لَم يُقَس» وتَمُرّ. فَحصٌ إلزاميٌّ كانَ
#  سَيوقِفُ كُلَّ تَحديثٍ لِلخِدمَة — بِما فيه إصلاحٌ أَمنيٌّ عاجِل —
#  حَتّى يُنقَرَ إعدادٌ يَدَوِيّ.
#
#  التَفصيل وخَطَوات المالِك في `docs/DEPLOY.md`.
#
# ══════════════════════════════════════════════════════════════════════

name: Deploy to Hugging Face Space

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # لِلتَراجُع وَحدَه: ادفَع رَقمَ إيداعٍ سابِقاً كانَ أَخضَرَ يَوماً.
  # وهذا المَسار **يَتَجاوَز البَوّابَة عَمداً** — لِأَنّ التَراجُع
  # يَستَهدِف حالَةً سَبَقَ أَن مَرَّت، والانتِظارُ لِبِناءٍ جَديدٍ
  # وَقتَ العَطَب هو الكَلفَة بِعَينِها.
  workflow_dispatch:
    inputs:
      ref:
        description: "رَقم الإيداع أو الفَرع المُراد نَشرُه (افتِراضيّاً main)"
        required: false
        default: main

concurrency:
  # دَفعَتان بِـ--force مُتَداخِلَتان تَجعَلانِ الفائِزَ مَسأَلَةَ تَوقيت.
  # ولا يُلغى الجاري: الإلغاءُ بَعدَ الدَفع وقَبلَ التَحَقُّق يُخَلِّف
  # نَشراً لا أَحَدَ قَرَأَ نَتيجَتَه.
  group: deploy-hf
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    # النَشر عَن دَفعٍ ناجِح إلى main، أَو عَن تَشغيلٍ يَدَويّ لِلتَراجُع.
    # و`workflow_run.event == 'push'` يَستَبعِد تَشغيلات CI الآتِيَة مِن
    # طَلَبات الدَمج (‏pull_request) — تِلكَ تَفحَص ولا تُنشَر.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    runs-on: ubuntu-latest
    # ‏15 ← 25: ميزانِيَّةُ استِطلاعِ الحَيِّ ‏900ث تُضافُ إلى الدَفعِ
    # وقِراءَةِ الـAPI. وبَقاءُ ‏15 كانَ سَيَقتُلُ الوَظيفَةَ **بَعدَ**
    # دَفعٍ ناجِح — أَي نَشراً لا أَحَدَ قَرَأَ نَتيجَتَه، وهو بِعَينِه ما
    # يُحَذِّرُ مِنه تَعليقُ `concurrency` أَدناه.
    timeout-minutes: 25

    steps:
      # ‏`workflow_run` لا يَحمِل الشَجَرَة، بَل رَقمَ الإيداع الَّذي
      # مَرَّ البَوّابَة. نَستَنسِخُه بِعَينِه — لا `main` — وإلّا نَشَرنا
      # إيداعاً لاحِقاً لَم يُختَبَر بَعد.
      - name: Checkout the exact commit CI approved
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.ref
                || github.event.workflow_run.head_sha }}
          # عُمقٌ كامِل بَقِيَ مِن يَومِ كانَت الشَجَرَةُ نَفسُها تُدفَع
          # (‏الاستِنساخُ الضَحل يُرَدّ بِـ"shallow update not allowed").
          # اليَومَ يُدفَع مُستودَعٌ جَديد مِن مُجَلَّدٍ مُفلتَر فَلا
          # يَلزَم — ويَبقى لِأَنّ `git rev-parse HEAD` هُنا هو ما
          # يُكتَب في رِسالَة الإيداع نَسَباً، وتَقليصُ العُمق تَحسينٌ
          # لا يُقاس أَثَرُه اليَوم.
          fetch-depth: 0

      - name: Assert the Space target is configured
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${HF_SPACE:-}" ] || missing="${missing} vars.HF_SPACE"
          [ -n "${HF_TOKEN:-}" ] || missing="${missing} secrets.HF_TOKEN"
          if [ -n "${missing}" ]; then
            echo "::error::إعداد ناقِص:${missing}"
            echo "المَطلوب — Settings → Secrets and variables → Actions:"
            echo "  · Secret   HF_TOKEN  = رَمز Hugging Face بِصَلاحِيَّة write"
            echo "  · Variable HF_SPACE  = <owner>/<space>   مِثال: wasayel/wasayel"
            echo "الخَطَوات كامِلَةً في docs/DEPLOY.md"
            exit 1
          fi
          case "${HF_SPACE}" in
            */*) : ;;
            *) echo "::error::HF_SPACE يَجِب أَن يَكون <owner>/<space> لا '${HF_SPACE}'"; exit 1 ;;
          esac
          echo "الهَدَف: huggingface.co/spaces/${HF_SPACE}"

      # ═══ الشَجَرَةُ المَدفوعَة هي ما يَبنيه الـDockerfile، لا أَكثَر ═══
      # الـSpace **عامّ** — ويَجِب أَن يَبقى عامّاً، فَالخاصّ يَحجُب
      # التَطبيقَ نَفسَه خَلفَ تَسجيل دُخول. فَما يُدفَع هُنا مَقروءٌ
      # لِأَيّ أَحَد في صَفحَة «Files» سَواءٌ دَخَلَ الصورَةَ أَم لا —
      # و`.dockerignore` لا يَحجُب عَن المُستودَع، إنَّما عَن سِياق
      # البِناء. لِذلك الفِلتَرَة هُنا هي الخَطُّ الأَوَّل.
      #
      # والقائِمَة **تُقاس مِن الـcsproj** (إغلاق `ProjectReference`
      # تَعَدِّيّاً مِن `apps/V1.App/V1.App.csproj`) لا تُكتَب بِاليَد،
      # فَلا تَنسى مَشروعاً ولا تَحمِل مَشروعاً ماتَ. والسكريبت نَفسُه
      # يَفشَل إن تَسَرَّبَ `docs/` أَو `scripts/` أَو `tests/` أَو
      # `.github/` أَو `CLAUDE.md` أَو `docker-compose.yml`.
      - name: Stage only what the Dockerfile builds
        run: |
          set -euo pipefail
          bash scripts/deploy-manifest.sh --stage "${RUNNER_TEMP}/hf-space"

      # ═══ خَطُّ الأَساس — يُقاسُ **قَبلَ** الدَفع، وإلّا لا يَحرُسُ شَيئاً ═══
      #
      # **الثَغرَةُ الَّتي يَسُدُّها، بِسيناريو**: الساعَةَ ‏14:00 يُدمَجُ
      # الإيداعُ A ويُنشَرُ وتَخضَرُّ البَوّابَة. الساعَةَ ‏15:00 يُعادُ
      # تَشغيلُ الوَظيفَة — «Re-run all jobs» بَعدَ انقِضاءِ مُهلَة، أَو
      # `workflow_dispatch` و`main` ما زالَ عِندَ A. تُدفَعُ الشَجَرَةُ
      # ويَبدَأُ HF البِناء، **وتَستَطلِعُ البَوّابَةُ فَوراً فَتَرُدُّ
      # الحاوِيَةُ القَديمَةُ `commit=A` و`$sha=A`**: تَطابُقٌ حَرفيٌّ
      # وjson وno-store ⇒ **أَخضَرُ خِلالَ ثَوانٍ**. ثُمَّ يَفشَلُ البِناءُ
      # الجَديدُ فَتَبقى الحاوِيَةُ القَديمَةُ تَخدِمُ إلى الأَبَد،
      # والمُلَخَّصُ يَقولُ «الحَيُّ يَخدِمُ A» — جُملَةٌ صادِقَةٌ حَرفِيّاً
      # وكاذِبَةٌ في مُرادِها. **وبَوّابَةٌ خَضراءُ قَبلَ أَن تَعمَلَ
      # لَيسَت بَوّابَة.**
      #
      # فَيُلتَقَطُ `startedAt` الآنَ، ويُشتَرَطُ بَعدَ الدَفعِ أَن
      # **يَتَقَدَّم** — أَي أَن تَكونَ حاوِيَةٌ قَد دارَت فِعلاً. ودِقَّةُ
      # الثانِيَةِ تَكفي: بِناءُ الـSpace دَقائِقُ لا أَجزاءُ ثانِيَة.
      # وغِيابُ خَطِّ أَساسٍ حالَةٌ مَشروعَة (‏أَوَّلُ نَشرٍ لِلنُقطَة).
      - name: Measure the live baseline before pushing
        env:
          HF_SPACE_URL: ${{ vars.HF_SPACE_URL }}
        run: |
          set -uo pipefail
          base_commit=""; base_started=""
          if [ -n "${HF_SPACE_URL:-}" ]; then
            body="$(curl -sS --max-time 20 "https://${HF_SPACE_URL}/health" 2>/dev/null || true)"
            base_commit="$(printf '%s' "${body}" | jq -r '.commit // empty' 2>/dev/null || true)"
            base_started="$(printf '%s' "${body}" | jq -r '.startedAt // empty' 2>/dev/null || true)"
          fi
          echo "base_commit=${base_commit}"   >> "$GITHUB_ENV"
          echo "base_started=${base_started}" >> "$GITHUB_ENV"
          echo "خَطُّ الأَساس: commit=${base_commit:-<لا شَيء>} startedAt=${base_started:-<لا شَيء>}"

      - name: Push the filtered tree to the Space
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_USER: ${{ vars.HF_USER }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          # اسمُ المُستَخدِم في الـURL يُشتَقّ مِن مالِك الـSpace ما لَم
          # يُصَرَّح بِغَيرِه — فَيَنقُص ما يُطلَب مِن المالِك بِمُتَغَيِّر.
          user="${HF_USER:-${HF_SPACE%%/*}}"

          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_ENV"
          echo "إيداع المَصدَر: ${sha}"

          # الرَقَمُ الَّذي لا أَمرَ يُنتِجُه يَتَعَفَّن — **وقَد تَعَفَّنَ
          # هُنا فِعلاً**: كانَ المُلَخَّصُ يَقول «‏مِن 757 مُتَتَبَّعاً»
          # والمَقيسُ اليَومَ ‏915. فَلا يُستَبدَلُ رَقمٌ بِرَقم، يُحسَب.
          tracked="$(git ls-files | wc -l | tr -d ' ')"
          echo "tracked=${tracked}" >> "$GITHUB_ENV"

          # ═══ البَصمَةُ تَدخُلُ الشَجَرَةَ قَبلَ الإيداعِ لا بَعدَه ═══
          # مَوضِعُها بَينَ حَدَّين، وكِلاهُما فَخّ:
          #   · **بَعدَ `--stage`** إلزاماً — فَالسكريبتُ يَبدَأُ بِـ
          #     `rm -rf "$STAGE_DIR"`، وكِتابَةٌ قَبلَه تُمحى صامِتَةً
          #     وفَحصُ «نُسِخَ = المَطلوب» داخِلَه يَبقى أَخضَرَ لِأَنَّه
          #     لا يَعرِفُ عَنها شَيئاً.
          #   · **قَبلَ `git add -A`** إلزاماً — وإلّا دُفِعَت شَجَرَةٌ بِلا
          #     بَصمَة، فَيَفشَلُ حارِسُ الـ`Dockerfile` وتَبقى الحاوِيَةُ
          #     القَديمَةُ تَخدِم.
          # والحَدّانِ مَحروسانِ بِـ`BuildIdentityEndpointTests`.
          printf '%s\n' "${sha}" > "${RUNNER_TEMP}/hf-space/.source-revision"

          # ═══ تاريخٌ مُسَطَّح بِقَصد ═══════════════════════════════
          # الشَجَرَةُ المَدفوعَة **لَيسَت** شَجَرَتَنا — هي مُجَلَّدٌ
          # مُشتَقٌّ مِنها. فَلا تاريخَ لَها تُواصِلُه، ومُحاوَلَةُ
          # حَملِ تاريخِنا إلَيها كانَت سَتَحمِل مَعَه **كُلّ مِلَفّ
          # حُذِفَ بِالفِلتَرَة** في الإيداعات السابِقَة — أَي أَنّ
          # `docs/` و`CLAUDE.md` يَبقَيانِ مَقروءَين مِن التاريخ رَغمَ
          # غِيابِهِما عَن الرَأس. والإيداعُ الواحِد يَقطَع ذلك.
          # ورَقمُ إيداع المَصدَر مَحفوظٌ في **رِسالَة** الإيداع، فَلا
          # يُفقَد النَسَب.
          #
          # ‏--force مَقصود لِنَفس السَبَب القَديم: مُستودَعُ الـSpace
          # تاريخٌ مُستَقِلّ أَنشَأَته HF، ولَيسَ سَلَفاً لِتاريخِنا.
          # والتَراجُع لا يُكَلِّف شَيئاً: يُعاد التَشغيل بِـ
          # `workflow_dispatch` عَلى الإيداع السابِق فَتُبنى شَجَرَتُه
          # المُفلتَرَة مِن جَديد.
          cd "${RUNNER_TEMP}/hf-space"
          git init -q -b main
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${sha}" \
                        -m "مِرآة مُفلتَرَة مِن wasayel-platform@${sha} — ما يَبنيه Dockerfile وَحدَه."
          space_sha="$(git rev-parse HEAD)"
          echo "space_sha=${space_sha}" >> "$GITHUB_ENV"
          echo "files=$(git ls-files | wc -l | tr -d ' ')" >> "$GITHUB_ENV"
          echo "إيداع الـSpace المُسَطَّح: ${space_sha}"

          # والرَمزُ لا يُطبَع: يُبنى الـURL في المُتَغَيِّر ولا يُصدَّر،
          # وGitHub يُقَنِّع قيمَةَ السِرّ في السِجِلّ عَلى كُلّ حال.
          git push --force \
            "https://${user}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git" \
            "HEAD:refs/heads/main"

      # ═══ الكاتِبُ الَّذي لا يُعيد القِراءَة يُبَلِّغ بِنِيَّتِه لا بِفِعلِه ═══
      - name: Read the Space back and assert it carries this commit
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          api="https://huggingface.co/api/spaces/${HF_SPACE}"
          # ‏`|| true` على `jq` مَقصود: صَفحَةُ خَطَإٍ بِـHTML بَدَل JSON
          # تَجعَل `jq` يَخرُج بِـ5، و`set -e` يَقتُل السكريبت في
          # المُحاوَلَة الأولى — فَتَصير حَلقَةُ الإعادَة زينَةً.
          remote_sha=""; stage="unknown"
          for attempt in 1 2 3; do
            body="$(curl -sS -H "Authorization: Bearer ${HF_TOKEN}" "${api}")" || body=""
            remote_sha="$(printf '%s' "${body}" | jq -r '.sha // empty' 2>/dev/null || true)"
            stage="$(printf '%s' "${body}" | jq -r '.runtime.stage // "unknown"' 2>/dev/null || echo unknown)"
            [ -n "${remote_sha}" ] && break
            echo "المُحاوَلَة ${attempt}: الـAPI لَم يُجِب بِرَقم إيداع — إعادَة بَعدَ 10ث"
            sleep 10
          done

          # يُقارَن بِـ`space_sha` لا بِـ`sha`: المَدفوع إيداعٌ **مُسَطَّح**
          # أُنشِئَ مِن الشَجَرَة المُفلتَرَة، ورَقمُه غَير رَقم المَصدَر.
          # ومُقارَنَتُه بِرَقم المَصدَر كانَت سَتَحمَرّ دائِماً — بَوّابَةٌ
          # تَصرُخ في كُلّ نَشرٍ ناجِح لا تُميَّز عَن بَوّابَةٍ مُعَطَّلَة.
          if [ "${remote_sha}" != "${space_sha}" ]; then
            echo "::error::الـSpace يَحمِل ${remote_sha:-<لا شَيء>} والمَدفوع ${space_sha}"
            exit 1
          fi
          echo "✅ مُستودَع الـSpace يَحمِل ${space_sha} (‏مِن المَصدَر ${sha})"
          echo "الحالَة الآن: ${stage}"

          # ═══ وما لا تَراه الأَداة لا تَدَّعيه ═══════════════════════
          # ‏`runtime.stage` يَصِف الحاوِيَةَ العامِلَة، ولا يَقول **مِن
          # أَيّ إيداعٍ بُنِيَت**. فَبَعدَ الدَفع مُباشَرَةً تُجيب
          # `RUNNING` وهي ما زالَت تَخدِم البِناءَ السابِق. لِذلك لا
          # تُعامَل هذِه القيمَةُ بُرهاناً ولا تُفشِل الوَظيفَة — تُطبَع
          # خَبَراً. والسُؤال «أَيّ إصدارٍ يَعمَل الآن؟» يُجيبُه
          # التَطبيقُ نَفسُه في الخُطوَة التالِيَة (‏`/health`، ADR-019).
          {
            echo "### النَشر إلى Hugging Face"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| الـSpace | \`${HF_SPACE}\` |"
            echo "| إيداع المَصدَر | \`${sha}\` |"
            echo "| الإيداع المُسَطَّح المَدفوع | \`${space_sha}\` |"
            echo "| إيداع الـSpace (‏مَقروءاً مِن الـAPI) | \`${remote_sha}\` |"
            echo "| المِلَفّات المَدفوعَة | \`${files}\` (‏مِن \`${tracked}\` مُتَتَبَّعاً) |"
            echo "| حالَة التَشغيل وَقتَ القِراءَة | \`${stage}\` |"
            echo "| المُطلِق | \`${{ github.event_name }}\` |"
            echo ""
            echo "سِجِلّ البِناء: https://huggingface.co/spaces/${HF_SPACE}?logs=build"
          } >> "$GITHUB_STEP_SUMMARY"

      # ═══ «نُشِرَ» لَيسَت «يَخدِم» — والفَرقُ يُقاسُ مِنَ التَطبيقِ نَفسِه ═══
      #
      # **وهذا كاشِفٌ لاحِق لا بَوّابَة، ويُقالُ بِاسمِه**: الخُطوَةُ تَلي
      # ‏`git push --force`، فَحُمرَتُها **لا تَتَراجَع ولا توقِفُ HF ولا
      # تَمنَعُ النَشرَ التالي**. وحينَ تَحمَرُّ فَالفِعلُ البَشَرِيُّ
      # واحِد: ‏`workflow_dispatch` على آخِرِ إيداعٍ أَخضَرَ مَعروف.
      # و`scripts/deploy-manifest.sh` بِخِلافِها **بَوّابَةٌ حَقيقِيَّة**
      # تَسبِقُ الدَفعَ وتُجهِضُه — والاسمُ الواحِدُ لِلاثنَينِ يَجعَلُ
      # القارِئَ يَحسِبُ أَنّ حُمرَةَ `/health` تَمنَعُ نَشراً، وهي لا تَمنَع.
      #
      # **ولِماذا لا يَكفي `%{http_code}` — مَقيسٌ لا مَخوَّفٌ مِنه**:
      # شُغِّلَ مَنطِقُ القَبولِ هذا بِعَينِه على المَوقِعِ الحَيِّ يَومَ
      # ‏2026-08-30 قَبلَ كِتابَةِ حَرف، فَأَعطى: `code=200` ·
      # `ctype=text/html` · ‏30,812 بايتاً · `commit=<فارِغ>` ⇒ **أَحمَر**.
      # لِأَنّ `TenantHome.razor` (`@page "/{slug}"`) يَبتَلِعُ `/health`
      # ويَرُدُّ ‏200. فَبَوّابَةٌ تَفحَصُ الرَمزَ وَحدَه **كانَت
      # سَتَخضَرُّ قَبلَ أَن يُكتَبَ حَرف** (القاعِدَة ١٠ — حَقنُ العَيب).
      - name: Assert the live Space serves this commit
        env:
          HF_SPACE:     ${{ vars.HF_SPACE }}
          HF_SPACE_URL: ${{ vars.HF_SPACE_URL }}
          WAIT:         ${{ vars.HF_HEALTH_WAIT_SECONDS }}
        run: |
          set -uo pipefail

          # ‏**غِيابُ المُتَغَيِّرِ لا يوقِفُ نَشراً** — يُسَمّى بِعَينِه
          # ويُقالُ في المُلَخَّصِ إنّ الحَيَّ **لَم يُقَس**. وفَحصٌ
          # إلزاميٌّ يُفشِلُ الوَظيفَةَ كانَ سَيُوقِفُ كُلَّ تَحديثٍ
          # لِلخِدمَة — بِما فيه إصلاحٌ أَمنيٌّ عاجِل — حَتّى يُنقَرَ
          # إعدادٌ يَدَوِيّ. **ولا يُشتَقُّ المُضيفُ تَخميناً**: الاشتِقاق
          # مَبنيٌّ على رَصدَةٍ واحِدَةٍ مِن ترويسَةِ `link` الحَيَّة ولا
          # يُوَثِّقُه شَيءٌ، واشتِقاقٌ خاطِئٌ يَستَطلِعُ مُضيفاً غَيرَ
          # مَوجودٍ فَيَتَّهِمُ نَشراً سَليماً.
          if [ -z "${HF_SPACE_URL:-}" ]; then
            echo "::warning::‏vars.HF_SPACE_URL غَير مَضبوط — الحَيُّ لَم يُقَس، والنَشرُ لَم يُوقَف."
            echo "المَطلوب — Settings → Secrets and variables → Actions → Variables:"
            echo "  · HF_SPACE_URL = acommerceecommerce-acommerce-ecommerce.hf.space"
            echo "| الحَيُّ يَخدِم | ⚠️ لَم يُقَس — \`vars.HF_SPACE_URL\` غَير مَضبوط |" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          budget="${WAIT:-900}"
          base="https://${HF_SPACE_URL}/health"
          t0=$(date +%s)
          code=""; ctype=""; commit=""; started=""; cc=""; hdr=""; probes=0
          agree=0; last_commit=""

          while :; do
            elapsed=$(( $(date +%s) - t0 ))
            [ "${elapsed}" -ge "${budget}" ] && break
            probes=$(( probes + 1 ))

            # ═══ نَقضُ التَخزينِ بِالطَلَب ═════════════════════════════
            # ‏`no-store` **في الرَدّ** لا يُثبِتُ أَنّ الرَدَّ لَم
            # يُخَزَّن: الرَأسُ يُسافِرُ مَعَ الجِسمِ المُخَزَّن، فَوَسيطٌ
            # مُتَساهِلٌ يُقَدِّمُ نُسخَةً مَحفوظَةً **ومَعَها الرَأسُ
            # نَفسُه**. فَسِلسِلَةُ الاستِعلامِ تُغَيِّرُ مِفتاحَ التَخزينِ
            # عِندَ أَيِّ وَسيط ولا تُؤَثِّرُ في مُطابَقَةِ
            # `MapGet("/health")`.
            url="${base}?probe=${sha}-${GITHUB_RUN_ID}-${probes}"
            http="$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' \
                      -D "${RUNNER_TEMP}/h.hdr" -o "${RUNNER_TEMP}/h.json" \
                      -w '%{http_code}|%{content_type}' "${url}" 2>/dev/null)" || http="000|"
            code="${http%%|*}"; ctype="${http#*|}"
            commit="$(jq -r '.commit // empty'    < "${RUNNER_TEMP}/h.json" 2>/dev/null || true)"
            started="$(jq -r '.startedAt // empty' < "${RUNNER_TEMP}/h.json" 2>/dev/null || true)"
            hdr="$(tr -d '\r' < "${RUNNER_TEMP}/h.hdr" || true)"
            cc="$(printf '%s' "${hdr}" | grep -i '^cache-control:' | head -1 || true)"
            replica="$(printf '%s' "${hdr}" | grep -i '^x-proxied-replica:' | head -1 || true)"

            # طَبَقَةُ تَخزينٍ وَسيطَة: لَم تُرصَد اليَوم، وتُفحَصُ آلِيّاً
            # لا في قائِمَةٍ يَدَوِيَّةٍ تُنَفَّذُ مَرَّةً واحِدَة.
            cached="$(printf '%s' "${hdr}" \
                      | grep -icE '^(age|etag|x-cache|cf-cache-status):' || true)"

            ok=1
            [ "${code}" = "200" ] || ok=0
            [ "${ctype#application/json}" != "${ctype}" ] || ok=0
            [ "${commit}" = "${sha}" ] || ok=0
            printf '%s' "${cc}" | grep -qi 'no-store' || ok=0
            [ "${cached}" -eq 0 ] || ok=0
            # ‏`startedAt` تَقَدَّمَ ⇒ حاوِيَةٌ دارَت فِعلاً. وغِيابُ خَطِّ
            # أَساسٍ حالَةٌ مَشروعَة تَمُرّ.
            if [ -n "${base_started:-}" ] && [ "${started}" = "${base_started}" ]; then ok=0; fi

            if [ "${ok}" = "1" ]; then
              # ولا يُخضَرُّ على عَيِّنَةٍ واحِدَة: ثَلاثُ استِطلاعاتٍ
              # مُتَّفِقَة. النُسَخُ المُتَعَدِّدَةُ لا تُستَبدَلُ ذَرِّيّاً،
              # فَعَيِّنَةٌ واحِدَةٌ قَد تُصادِفُ النُسخَةَ الَّتي فَرَغَت
              # أَوَّلاً بَينَما أُخرى ما زالَت تَخدِمُ القَديم.
              if [ "${commit}" = "${last_commit}" ]; then agree=$(( agree + 1 )); else agree=1; fi
              last_commit="${commit}"
              if [ "${agree}" -ge 3 ]; then
                echo "✅ الحَيُّ يَخدِمُ ${sha} بَعدَ ${elapsed}ث (‏${probes} استِطلاعاً، ${agree} مُتَّفِقَة)"
                {
                  echo "| الحَيُّ يَخدِم | \`${commit}\` — بَعدَ \`${elapsed}\`ث، \`${probes}\` استِطلاعاً |"
                  echo "| بَدَأَت | \`${started}\` (‏خَطُّ الأَساس \`${base_started:-<لا شَيء>}\`) |"
                  echo "| النُسخَة | \`${replica:-<لا رَأس>}\` |"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            else
              agree=0
            fi

            echo "…${elapsed}ث/${budget} [${probes}]: code=${code} type=${ctype} commit=${commit:-<لا شَيء>} started=${started:-<لا شَيء>} cached=${cached}"
            sleep 15
          done

          # ═══ حُمرَتانِ مُختَلِفَتانِ لا رِسالَةٌ واحِدَة ═══════════════
          # «لَم يَنتَهِ البِناء» تَستَدعي «اِرفَعِ الميزانِيَّةَ وانتَظِر»،
          # و«يَخدِمُ إيداعاً آخَر» تَستَدعي «تَراجَعِ الآن». ودَمجُهُما في
          # رِسالَةٍ واحِدَةٍ يَجعَلُ القارِئَ يُخَمِّن.
          if [ -n "${commit}" ] && [ "${commit}" != "${sha}" ] && [ "${#commit}" -eq 40 ]; then
            verdict="عَدَمُ مُطابَقَة: الحَيُّ يَخدِمُ \`${commit}\` والمَدفوعُ \`${sha}\`"
            echo "::error::${verdict} — تَراجَعْ بِـworkflow_dispatch على آخِرِ إيداعٍ أَخضَرَ مَعروف."
          else
            verdict="البِناءُ لَم يَجهَز خِلالَ \`${budget}\`ث (‏آخِرُ ما قيسَ: code=\`${code}\` type=\`${ctype}\`)"
            echo "::error::${verdict}"
          fi
          echo "سِجِلّ البِناء: https://huggingface.co/spaces/${HF_SPACE}?logs=build"

          # **والمُلَخَّصُ يُكتَبُ في الفَرعَينِ مَعاً**: الجَولَةُ الحَمراءُ
          # هي الوَحيدَةُ الَّتي تُقرَأُ لاحِقاً، وكانَت الوَحيدَةَ بِلا جَدوَل.
          {
            echo "| الحَيُّ يَخدِم | ❌ ${verdict} |"
            echo "| استِطلاعات | \`${probes}\` في \`$(( $(date +%s) - t0 ))\`ث |"
            echo "| النُسخَة | \`${replica:-<لا رَأس>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
